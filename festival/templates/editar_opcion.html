{% extends 'base.html' %}

{% block titulo %}Editar Opción{% endblock %}

{% block miga_pan %}

<nav class="breadcrumb-festival">

    <a href="{% url 'panel_administrativo' %}">
        Panel administrativo
    </a>

    <span>›</span>

    <a href="{% url 'administrar_opciones' %}">
        Gestión de opciones
    </a>

    <span>›</span>

    <span>Editar opción</span>

</nav>

{% endblock %}

{% block contenido %}

<div class="card shadow p-4 mx-auto" style="max-width: 600px;">

    <h2 class="titulo-votacion">Editar Opción</h2>

    <form method="POST" class="formulario-gestion">

        {% csrf_token %}

        <div class="grupo-formulario">
            <label class="label">Nombre de la opción</label>
            {{ formulario.nombre }}
        </div>

        <div class="grupo-formulario">
            <label class="label">Categoría</label>
            {{ formulario.categoria }}
        </div>

        <button type="submit" class="btn btn-success w-100">
            Guardar Cambios
        </button>

        <a href="{% url 'administrar_opciones' %}"
           class="btn btn-secondary w-100 mt-2">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
